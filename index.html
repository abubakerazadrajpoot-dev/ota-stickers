<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abubakar's Anime Sticker Hub</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; text-align: center; padding: 20px; }
        .container { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .card { background: #1f1f1f; border-radius: 15px; width: 280px; padding: 20px; border: 1px solid #333; }
        img { width: 100%; border-radius: 10px; height: auto; margin-bottom: 10px; }
        button { background: #ff4500; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Abubakar's Anime Sticker Hub 🍥</h1>
    <div class="container">
        <div class="card">
            <img src="https://i.pinimg.com/originals/27/ad/47/27ad47f4da7e05910243b999df5e94b5.jpg" alt="Naruto">
            <h3>Naruto Sage</h3>
            <button>Add to Cart</button>
        </div>
        <div class="card">
            <img src="https://i.pinimg.com/originals/95/9d/2e/959d2e0787e97148a0a86b360249826a.jpg" alt="Gojo">
            <h3>Satoru Gojo</h3>
            <button>Add to Cart</button>
        </div>
    </div>
</body>
</html>
