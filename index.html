<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Sticker Hub</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: white; text-align: center; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; padding: 20px; }
        .card { background: #333; margin: 10px; padding: 15px; border-radius: 10px; width: 200px; }
        img { width: 100%; border-radius: 5px; height: 200px; object-fit: cover; }
        button { background: #ff4500; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Abubakar's Anime Sticker Hub 🍥</h1>
    <div class="container">
        <div class="card">
            <img src="https://i.pinimg.com/originals/27/ad/47/27ad47f4da7e05910243b999df5e94b5.jpg" alt="Naruto">
            <h3>Naruto Sage</h3>
            <button>Add to Cart</button>
        </div>
        <div class="card">
            <img src="https://i.pinimg.com/originals/95/9d/2e/959d2e0787e97148a0a86b360249826a.jpg" alt="Gojo">
            <h3>Satoru Gojo</h3>
            <button>Add to Cart</button>
        </div>
    </div>
</body>
</html>
